name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Versions and license copies agree
        run: |
          node tools/version.mjs --check "$(node tools/version.mjs)"
          cmp LICENSE bindings/node/LICENSE
          cmp LICENSE bindings/python/LICENSE

      - name: Generate abaplint golden data
        run: |
          npm ci --prefix tools
          node tools/oracle.mjs tests/corpus/golden --list tests/corpus/corpora.txt
          node tools/oracle.mjs --sql-cases tests/corpus/abaplint/statements tests/corpus/golden/sql_cases.json

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --release -- --nocapture
      - name: Generated binding types are up to date
        run: node tools/gen-types.mjs --check

      - name: Node.js binding
        working-directory: bindings/node
        run: |
          node build.mjs
          npm test

      - name: Python binding, as an installed wheel
        working-directory: bindings/python
        run: |
          pip install maturin==1.15.0
          maturin build --release --out dist
          pip install --no-index --find-links dist abap-parser
          python -m unittest discover -s tests -v

  # the same without the abaplint comparisons, which are skipped without
  # golden data
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo test --release
      - name: Node.js binding
        working-directory: bindings/node
        run: |
          node build.mjs
          npm test
      - name: Python binding, as an installed wheel
        working-directory: bindings/python
        run: |
          pip install maturin==1.15.0
          maturin build --release --out dist
          pip install --no-index --find-links dist abap-parser
          python -m unittest discover -s tests -v
