name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate abaplint golden data
        run: |
          npm ci --prefix tools
          node tools/oracle.mjs tests/corpus/golden --list tests/corpus/corpora.txt
          node tools/oracle.mjs --sql-cases tests/corpus/abaplint/statements tests/corpus/golden/sql_cases.json

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --release -- --nocapture
      - name: Generated binding types are up to date
        run: node tools/gen-types.mjs --check

      - name: Node.js binding
        working-directory: bindings/node
        run: |
          node build.mjs
          npm test

      - name: Python binding
        working-directory: bindings/python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin==1.15.0
          .venv/bin/maturin develop --release
          .venv/bin/python -m unittest discover -s tests -v
