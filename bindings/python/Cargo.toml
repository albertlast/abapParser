[package]
name = "abap-python"
description = "Python binding of the ABAP parser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
abap-analysis.workspace = true
pyo3 = { version = "=0.29.2", features = ["abi3-py39"] }
