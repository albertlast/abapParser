[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "abap-parser"
version = "0.1.0"
description = "ABAP parser: symbols and statements of ABAP source code"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
module-name = "abap_parser._native"
python-source = "python"
features = ["pyo3/extension-module"]
